# Isolation: This identity belongs only to the Vulture repository runner.
apiVersion: v1
kind: Namespace
metadata:
  name: terraform-ci
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraform-runner
  namespace: terraform-ci
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-runner-ingress
  namespace: terraform-ci
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
